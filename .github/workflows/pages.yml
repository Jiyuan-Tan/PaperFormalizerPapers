# Builds the site from papers/ (site/build.mjs) and publishes it on GitHub Pages, at every push to
# main and when ingest.yml asks (it commits with the run's token, whose pushes start no workflow).
#
# OWNER SETUP: Settings → Pages → Source: "GitHub Actions", custom domain paperformalizer.org (README
# "Owner setup"). (On a free plan, Pages serves a public repository only.)
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# the build reads papers/ (untrusted bundles): it holds no write permission; only the deploy does
permissions:
  contents: read

# the latest build wins; a deploy under way is not cut short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the build cleans each paper's page in a headless Chromium (site/sanitize.mjs)
      - name: Install the build's dependencies
        run: npm ci --no-audit --no-fund && npx playwright-core install --with-deps chromium
      - name: Build the site
        run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
