# PaperFormalizer share worker — deploy with (from this directory):
#   npx wrangler deploy
# Before the first deploy, see README.md here: the R2 bucket, its lifecycle rules, the OAuth App and
# the four secrets (set once each with `npx wrangler secret put <NAME>`):
#   GITHUB_CLIENT_SECRET   the OAuth App's client secret
#   GITHUB_DISPATCH_TOKEN  fine-grained PAT: repository Jiyuan-Tan/PaperFormalizerPapers only, Contents read & write
#   SESSION_SECRET         random, e.g. `openssl rand -base64 48`
#   INGEST_SECRET          random; the same value is the registry's Actions secret INGEST_SECRET
name = "theoremchecker-share"
main = "worker.js"
compatibility_date = "2026-08-01"
# Served at its own domain, share.paperformalizer.org (a Workers custom domain: `wrangler deploy`
# creates its DNS record and certificate in the paperformalizer.org zone). The *.workers.dev address
# is off, so there is one address.
workers_dev = false
routes = [{ pattern = "share.paperformalizer.org", custom_domain = true }]

[vars]
# A CLASSIC OAuth App (client id Ov23…), never a GitHub App (Iv23…): a GitHub App's consent screen says
# "Act on your behalf" whatever its permissions. Authorized with no `scope`, the OAuth App's says
# "public data only". Its callback URL: https://share.paperformalizer.org/auth/callback
GITHUB_CLIENT_ID = "Ov23li1PzsFTwbTuALRi"
REGISTRY = "Jiyuan-Tan/PaperFormalizerPapers"
SITE_URL = "https://paperformalizer.org/"
WORKER_URL = "https://share.paperformalizer.org/"

# One bucket: meta/<id>.json (an upload's manifest, status and sharer) and bundles/<id>.tar.gz.
# Create it with `npx wrangler r2 bucket create theoremchecker-share` (the name it was made under).
[[r2_buckets]]
binding = "SHARES"
bucket_name = "theoremchecker-share"

# Per-IP rate limits (Workers Rate Limiting binding). `period` must be 10 or 60. Without the binding
# the worker runs unlimited.
[[unsafe.bindings]]
name = "UPLOAD_RATELIMIT"
type = "ratelimit"
namespace_id = "2101"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "LOGIN_RATELIMIT"
type = "ratelimit"
namespace_id = "2102"
simple = { limit = 20, period = 60 }
