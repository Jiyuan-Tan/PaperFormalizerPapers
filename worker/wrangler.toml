# TheoremChecker share worker — deploy with (from this directory):
#   npx wrangler deploy
# Before the first deploy, see README.md here: the R2 bucket, its lifecycle rules, the OAuth App and
# the four secrets (set once each with `npx wrangler secret put <NAME>`):
#   GITHUB_CLIENT_SECRET   the OAuth App's client secret
#   GITHUB_DISPATCH_TOKEN  fine-grained PAT: repository Jiyuan-Tan/TheoremCheckerPapers only, Contents read & write
#   SESSION_SECRET         random, e.g. `openssl rand -base64 48`
#   INGEST_SECRET          random; the same value is the registry's Actions secret INGEST_SECRET
name = "theoremchecker-share"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
# A CLASSIC OAuth App (client id Ov23…), never a GitHub App (Iv23…): a GitHub App's consent screen says
# "Act on your behalf" whatever its permissions. Authorized with no `scope`, the OAuth App's says
# "public data only". Its callback URL: https://theoremchecker-share.comments-worker.workers.dev/auth/callback
GITHUB_CLIENT_ID = "Ov23li1PzsFTwbTuALRi"
REGISTRY = "Jiyuan-Tan/TheoremCheckerPapers"
SITE_URL = "https://jiyuan-tan.github.io/TheoremCheckerPapers/"
WORKER_URL = "https://theoremchecker-share.comments-worker.workers.dev/"

# One bucket: meta/<id>.json (an upload's manifest, status and sharer) and bundles/<id>.tar.gz.
# Create it with `npx wrangler r2 bucket create theoremchecker-share`.
[[r2_buckets]]
binding = "SHARES"
bucket_name = "theoremchecker-share"

# Per-IP rate limits (Workers Rate Limiting binding). `period` must be 10 or 60. Without the binding
# the worker runs unlimited.
[[unsafe.bindings]]
name = "UPLOAD_RATELIMIT"
type = "ratelimit"
namespace_id = "2101"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "LOGIN_RATELIMIT"
type = "ratelimit"
namespace_id = "2102"
simple = { limit = 20, period = 60 }
