name = "oai-sharp-threshold-monotone"
defaultTargets = ["Papers"]

# Generated by PaperFormalizer: a standalone project. It requires the public base libraries
# only; everything else it uses is in this directory. Mathlib stays the last require.

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Causal inference and statistics foundations (identification, estimation, semiparametrics, concentration).
[[require]]
name = "Causalean"
git = "https://github.com/Jiyuan-Tan/CausalSmith"
rev = "a7085d88d2e4b30003db7097ca374f4718da0f01"

# the Lean mathematical library
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Papers"
requiresModuleSystem = true
